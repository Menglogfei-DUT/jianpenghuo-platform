<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 碱蓬火智能美育综合分析平台</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-box">
    <div class="brand">
      <img src="/static/logo.jpg" alt="碱蓬火" class="login-logo">
      <h1>碱蓬火智能美育综合分析平台</h1>
      <p>V2.0 · 五育并举（德智体美劳） · AI 智能分析与区域发展研判</p>
    </div>
    <div class="tabs">
      <div id="tab_login" class="active" onclick="switchTab('login')">登 录</div>
      <div id="tab_reg" onclick="switchTab('reg')">注 册</div>
    </div>
    <div id="panel_login">
      <div class="field"><label>手机号</label><input type="text" id="lg_phone" placeholder="请输入11位手机号" maxlength="11"></div>
      <div class="field"><label>密码</label><input type="password" id="lg_pwd" placeholder="请输入密码"></div>
      <button class="btn primary btn-block" onclick="doLogin()">登 录</button>
      <div class="msg" id="lg_msg"></div>
    </div>
    <div id="panel_reg" style="display:none">
      <div class="field"><label>手机号（将作为登录账号）</label><input type="text" id="rg_phone" placeholder="请输入11位手机号" maxlength="11"></div>
      <div class="field">
        <label>短信验证码</label>
        <div class="code-row">
          <input type="text" id="rg_code" placeholder="6位验证码" maxlength="6">
          <button class="btn gray" id="btn_code" onclick="sendCode()">获取验证码</button>
        </div>
      </div>
      <div class="field"><label>设置密码（至少6位）</label><input type="password" id="rg_pwd" placeholder="请输入密码"></div>
      <div class="field"><label>确认密码</label><input type="password" id="rg_pwd2" placeholder="再次输入密码"></div>
      <button class="btn green btn-block" onclick="doRegister()">注 册 并 登 录</button>
      <div class="msg" id="rg_msg"></div>
    </div>
    <div class="tip">
      演示账号：13800000000 / 123456<br>注册页验证码为模拟短信，获取后按页面提示输入即可
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
function toast(msg, type) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast show ' + (type || ''); setTimeout(function () { t.className = 'toast'; }, 3000); }
function switchTab(t) {
  document.getElementById('tab_login').className = t === 'login' ? 'active' : '';
  document.getElementById('tab_reg').className = t === 'reg' ? 'active' : '';
  document.getElementById('panel_login').style.display = t === 'login' ? '' : 'none';
  document.getElementById('panel_reg').style.display = t === 'reg' ? '' : 'none';
}
function setMsg(id, text, ok) { var el = document.getElementById(id); el.textContent = text || ''; el.className = 'msg' + (ok ? ' ok' : ''); }
async function api(url, body) {
  var res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return res.json();
}
async function doLogin() {
  var phone = document.getElementById('lg_phone').value.trim();
  var pwd = document.getElementById('lg_pwd').value;
  if (!/^1[3-9]\d{9}$/.test(phone)) { setMsg('lg_msg', '请输入正确的11位手机号'); return; }
  if (!pwd) { setMsg('lg_msg', '请输入密码'); return; }
  setMsg('lg_msg', '登录中…');
  var r = await api('/api/login', { phone: phone, password: pwd });
  if (r.ok) { toast('登录成功', 'success'); setTimeout(function () { location.href = '/'; }, 400); }
  else setMsg('lg_msg', r.msg || '登录失败');
}
var codeTimer = null;
async function sendCode() {
  var phone = document.getElementById('rg_phone').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) { setMsg('rg_msg', '请输入正确的11位手机号'); return; }
  setMsg('rg_msg', '发送中…');
  var r = await api('/api/send_code', { phone: phone });
  if (r.ok) {
    setMsg('rg_msg', '验证码已生成（演示模式），请在下方输入：' + r.demo_code, true);
    toast('演示验证码：' + r.demo_code, 'success');
    var btn = document.getElementById('btn_code');
    var n = 60; btn.disabled = true; btn.textContent = n + 's';
    if (codeTimer) clearInterval(codeTimer);
    codeTimer = setInterval(function () {
      n--; btn.textContent = n + 's';
      if (n <= 0) { clearInterval(codeTimer); btn.disabled = false; btn.textContent = '重新获取'; }
    }, 1000);
  } else setMsg('rg_msg', r.msg || '发送失败');
}
async function doRegister() {
  var phone = document.getElementById('rg_phone').value.trim();
  var code = document.getElementById('rg_code').value.trim();
  var pwd = document.getElementById('rg_pwd').value;
  var pwd2 = document.getElementById('rg_pwd2').value;
  if (!/^1[3-9]\d{9}$/.test(phone)) { setMsg('rg_msg', '请输入正确的11位手机号'); return; }
  if (!/^\d{6}$/.test(code)) { setMsg('rg_msg', '请输入6位验证码'); return; }
  if (pwd.length < 6) { setMsg('rg_msg', '密码至少6位'); return; }
  if (pwd !== pwd2) { setMsg('rg_msg', '两次密码不一致'); return; }
  setMsg('rg_msg', '注册中…');
  var r = await api('/api/register', { phone: phone, code: code, password: pwd });
  if (r.ok) { toast('注册成功', 'success'); setTimeout(function () { location.href = '/'; }, 500); }
  else setMsg('rg_msg', r.msg || '注册失败');
}
document.getElementById('lg_phone').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('lg_pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('rg_pwd2').addEventListener('keydown', function (e) { if (e.key === 'Enter') doRegister(); });
</script>
</body>
</html>
